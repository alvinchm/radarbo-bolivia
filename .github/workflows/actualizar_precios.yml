name: Actualizar Precios Tiendas Bolivia (Cada 6 Horas)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-bolivia:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Scraper de Tiendas Bolivianas
        run: python scraper/scraper_bolivia.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'RadarBO Bot'
          git config --global user.email 'bot@radarbo.local'
          git add data/precios_bolivia.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar precios tiendas Bolivia" && git push)
